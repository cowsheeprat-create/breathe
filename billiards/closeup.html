<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cue Close-up</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --ground:#07090d; --surface:#10161e; --surface-2:#18212c; --hairline:#26313e;
  --ink:#e8edf5; --ink-dim:#93a0b3; --ink-faint:#5d6a7c;
  --accent:#7fd4a4; --amber:#ffc66b; --blue:#8cc4ff;
  --font-ui:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:14px/1.4 var(--font-ui);
  -webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100dvh;overflow:hidden}
header{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--hairline);background:var(--surface);flex-wrap:wrap}
.brand{font-weight:650;letter-spacing:.02em}
.brand span{color:var(--ink-dim);font-weight:400;margin-left:6px}
#chips{display:flex;gap:6px;flex-wrap:wrap}
button,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--hairline);border-radius:8px;padding:6px 10px;cursor:pointer}
button:hover,select:hover{border-color:#3a4a5e}
button:active{transform:translateY(1px)}
button.chip{border-radius:999px;padding:5px 12px;color:var(--ink-dim)}
button.chip.on{background:#173325;border-color:var(--accent);color:var(--ink)}
button.primary{background:var(--accent);border-color:var(--accent);color:#06120b;font-weight:650}
button.on{background:#173325;border-color:var(--accent);color:var(--accent)}
button.small{padding:3px 8px;font-size:12px}
.layout{flex:1;display:flex;min-height:0}
.stage{position:relative;flex:1;min-width:0;min-height:0;background:#07090d}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#hud{position:absolute;left:12px;bottom:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;pointer-events:none}
.tag{background:rgba(7,9,13,.78);border:1px solid var(--hairline);border-radius:10px;padding:6px 10px;font-family:var(--font-mono);font-size:12px;color:var(--ink)}
.tag b{color:var(--amber);font-weight:600}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(7,9,13,.88);border:1px solid var(--hairline);
  padding:7px 14px;border-radius:999px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92%;text-align:center}
#toast.show{opacity:1}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--ink-dim)}
.panel{width:340px;flex:none;overflow-y:auto;border-left:1px solid var(--hairline);background:var(--surface);padding:12px 14px 20px;display:flex;flex-direction:column;gap:14px}
.panel h2{margin:0 0 4px;font-size:16px}
.panel h3{margin:0 0 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim);font-weight:600}
.panel p{margin:0 0 6px;color:var(--ink-dim);line-height:1.45;font-size:13px}
.panel ul{margin:6px 0 0;padding-left:18px;color:var(--ink-dim);font-size:12.5px;line-height:1.45}
.panel li{margin-bottom:4px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.row label.l{color:var(--ink-dim);min-width:74px}
input[type=range]{flex:1;min-width:90px;accent-color:var(--accent)}
.val{font-family:var(--font-mono);font-size:12px;min-width:62px;text-align:right}
.mono{font-family:var(--font-mono);font-size:12px;color:var(--ink-dim);white-space:pre-wrap}
.english{display:flex;gap:12px;align-items:center}
#eng{width:104px;height:104px;touch-action:none;cursor:crosshair;flex:none}
.btns{display:flex;flex-wrap:wrap;gap:5px}
.checks label{display:flex;align-items:center;gap:7px;margin-bottom:4px;color:var(--ink);cursor:pointer}
table.rd{width:100%;border-collapse:collapse;font-size:12.5px}
table.rd td{padding:2px 0;vertical-align:top}
table.rd td:first-child{color:var(--ink-dim);padding-right:8px}
table.rd td:last-child{text-align:right;font-family:var(--font-mono)}
.good{color:var(--accent)} .warn{color:var(--amber)}
@media (max-width:860px){
  body{overflow:auto}
  .layout{flex-direction:column}
  .stage{flex:none;height:56vh;min-height:320px;position:sticky;top:0;z-index:5}
  .panel{width:auto;border-left:0;border-top:1px solid var(--hairline);overflow:visible}
}
</style>
</head>
<body>
<header>
  <div class="brand">Cue<span>close-up</span></div>
  <div id="chips"></div>
</header>
<div class="layout">
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div id="toast"></div>
    <div id="hud"></div>
    <div id="err">This view needs WebGL, which this browser isn’t providing.</div>
  </div>
  <aside class="panel">
    <section>
      <h2 id="sctitle"></h2>
      <p id="scdesc"></p>
      <ul id="scwatch"></ul>
    </section>

    <section>
      <h3>Shot</h3>
      <div class="row ctl" data-ctl="cut"><label class="l" for="s-cut" id="l-cut">Cut angle</label><input id="s-cut" type="range" min="-60" max="60" step="0.5"><span class="val" id="v-cut"></span></div>
      <div class="row ctl" data-ctl="objDist"><label class="l" for="s-objDist">Object ball</label><input id="s-objDist" type="range" min="0.25" max="1.2" step="0.01"><span class="val" id="v-objDist"></span></div>
      <div class="row ctl" data-ctl="dist"><label class="l" for="s-dist">Cue ball</label><input id="s-dist" type="range" min="0.15" max="1.1" step="0.01"><span class="val" id="v-dist"></span></div>
      <div class="row ctl" data-ctl="power"><label class="l" for="s-power">Power</label><input id="s-power" type="range" min="0.05" max="1" step="0.01"><span class="val" id="v-power"></span></div>
      <div class="row ctl" data-ctl="err"><label class="l" for="s-err">Aim error</label><input id="s-err" type="range" min="-30" max="30" step="0.5"><span class="val" id="v-err"></span></div>
      <div class="english" style="margin-top:8px">
        <canvas id="eng" width="208" height="208" title="Where the tip hits the cue ball (as seen from behind). Drag to set; double-click to centre."></canvas>
        <div>
          <div class="mono" id="engv" style="margin-bottom:6px"></div>
          <div class="btns">
            <button class="small" data-eng="0,0">Centre</button>
            <button class="small" data-eng="0,0.4">Follow</button>
            <button class="small" data-eng="0,-0.45">Draw</button>
            <button class="small" data-eng="-0.45,0">Left</button>
            <button class="small" data-eng="0.45,0">Right</button>
          </div>
        </div>
      </div>
      <div class="row" style="margin-top:10px">
        <button id="shoot" class="primary" style="flex:1;padding:9px">Shoot</button>
        <button id="reset">Reset</button>
      </div>
      <div class="row">
        <button id="pause">Pause</button>
        <button id="step" title="Advance 2 ms">Step 2 ms</button>
        <select id="speed" aria-label="Playback speed">
          <option value="1">1×</option>
          <option value="0.25">¼×</option>
          <option value="0.1">0.1×</option>
          <option value="0.03">0.03×</option>
          <option value="0.01">0.01×</option>
        </select>
      </div>
    </section>

    <section>
      <h3>Camera</h3>
      <div class="btns">
        <button class="small" data-cam="three">3/4</button>
        <button class="small" data-cam="contact">Contact</button>
        <button class="small" data-cam="low">Low</button>
        <button class="small" data-cam="cue">Cue’s eye</button>
        <button class="small" data-cam="pocket">Pocket</button>
        <button class="small" data-cam="rail">Rail</button>
        <button class="small" data-cam="top">Top</button>
      </div>
      <div class="mono" style="margin-top:6px">Drag to orbit · scroll or pinch to zoom</div>
    </section>

    <section class="checks">
      <h3>Show</h3>
      <label><input type="checkbox" id="ck-ghost" checked> Ghost ball &amp; aim lines</label>
      <label><input type="checkbox" id="ck-trails" checked> Ball trails (dots every 20 ms)</label>
      <label><input type="checkbox" id="ck-spin"> Spin axes</label>
      <label><input type="checkbox" id="ck-comp" checked> Compensate for squirt</label>
      <label><input type="checkbox" id="ck-auto" checked> Auto slow-motion at contact</label>
      <label><input type="checkbox" id="ck-follow"> Camera follows the action</label>
    </section>

    <section>
      <h3>Live</h3>
      <table class="rd" id="live"></table>
    </section>
    <section>
      <h3>At contact</h3>
      <table class="rd" id="contact"></table>
    </section>
  </aside>
</div>

<script src="vendor/three.min.js"></script>
<script src="physics.js"></script>
<script src="scenarios.js"></script>
<script src="closeup.js"></script>
</body>
</html>
